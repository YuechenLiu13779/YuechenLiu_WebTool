<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art Style Match</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <!-- 上方工作区 -->
    <div class="workspace">

      <!-- 左侧：作品和匹配游戏 -->
      <main class="compare-part">

        <header class="header">
          <button id="history-button" type="button">History</button>

          <h1>Art Style Match</h1>

          <button id="notes-button" type="button">Notes</button>
        </header>

        <!-- 作品显示区域 -->
        <div id="artwork-area" class="artwork-area">
          <p class="empty-message">
            Choose art styles and enter a keyword to begin.
          </p>
        </div>

      </main>

      <!-- 右侧：笔记，开始时隐藏 -->
      <aside id="notes-part" class="notes-part" hidden>

        <div class="notes-header">
          <input
            id="notes-title"
            type="text"
            placeholder="Note name"
            aria-label="Note name"
          >

          <button id="save-notes" type="button">Save</button>
          <button id="download-notes" type="button">Download</button>

          <button
            id="close-notes"
            type="button"
            aria-label="Close notes"
          >
            ×
          </button>
        </div>

        <p id="notes-hint" class="notes-hint" role="status">
        Drag artworks here. Click the blank area to write. </p>

        <div class="notes-tools">
        <button id="clear-notes" type="button">Clear Notes</button>
        </div>

        <div id="notes-content" class="notes-content"></div>

      </aside>
    </div>

    <!-- 底部操作栏 -->
    <footer class="control-bar">

      <div class="style-controls">
        <label for="style-select">Art styles</label>

        <select id="style-select">
          <option value="">Select a style</option>
          <option value="Impressionism">Impressionism</option>
          <option value="Post-Impressionism">Post-Impressionism</option>
          <option value="Neo-Impressionism">Neo-Impressionism</option>
          <option value="Cubism">Cubism</option>
          <option value="Pointillism">Pointillism</option>
          <option value="Surrealism">Surrealism</option>
          <option value="Expressionism">Expressionism</option>
          <option value="Abstract Expressionism">Abstract Expressionism</option>
          <option value="Modernism">Modernism</option>
          <option value="Symbolism">Symbolism</option>
          <option value="Fauvism">Fauvism</option>
          <option value="Realism">Realism</option>
          <option value="Romanticism">Romanticism</option>
          <option value="Baroque">Baroque</option>
          <option value="Rococo">Rococo</option>
          <option value="Art Nouveau">Art Nouveau</option>
          <option value="Art Deco">Art Deco</option>
          <option value="Pop Art">Pop Art</option>
          <option value="Minimalism">Minimalism</option>
          <option value="Ukiyo-e">Ukiyo-e</option>
        </select>
      </div>

      <!-- 选择流派后，JavaScript 会在这里添加 Tag -->
      <div id="selected-styles" class="selected-styles"></div>

      <form id="search-form" class="keyword-controls">
        <label for="keyword-input">Keyword</label>

        <input
          id="keyword-input"
          type="text"
          placeholder="Try portrait, flowers, or city"
        >

        <span class="input-hint">Press Enter to search</span>
      </form>

      <div class="round-controls">
        <button id="check-answers" type="button">
          Check Answers
        </button>

        <button id="new-round" type="button">
          New Round
        </button>
      </div>

      <!-- 加载状态、错误和操作提示 -->
      <p id="status-message" class="status-message" role="status"></p>

    </footer>
  </div>

  <!-- History 浮层 -->
  <div id="history-overlay" class="overlay" hidden>
    <section
      class="history-window"
      role="dialog"
      aria-modal="true"
      aria-label="History"
    >
      <div class="history-header">
        <div class="history-tabs">
          <button id="compare-history-tab" type="button">
            Compare History
          </button>

          <button id="notes-history-tab" type="button">
            Notes History
          </button>
        </div>

        <button
          id="close-history"
          type="button"
          aria-label="Close history"
        >
          ×
        </button>
      </div>

      <div id="history-content" class="history-content"></div>
    </section>
  </div>

  <!-- 图片放大和历史作品详情 -->
  <div id="artwork-overlay" class="overlay" hidden>
    <section
      class="artwork-window"
      role="dialog"
      aria-modal="true"
      aria-label="Artwork details"
    >
      <button
        id="close-artwork"
        class="close-artwork"
        type="button"
        aria-label="Close artwork"
      >
        ×
      </button>

      <img id="large-artwork" alt="">

      <div id="artwork-details"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="sketch.js"></script>
<script src="tool.js"></script>
</body>
</html>
